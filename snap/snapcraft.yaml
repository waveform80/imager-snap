name: rpi-imager
base: core24
adopt-info: imagewriter
summary: Raspberry Pi Imager
website: https://www.raspberrypi.com/software/
source-code: https://github.com/r41k0u/rpi-imager
issues: https://github.com/waveform80/imager-snap
icon: images/rpi-imager.png
license: Apache-2.0
description: |
  Raspberry Pi Imager is an easy to use application for installing Raspberry Pi
  OS, or other operating systems, to an SD card ready to use with your
  Raspberry Pi.

  Usage is as simple as:

  1. Pick the Raspberry Pi board you want to use.

  2. Pick the operating system you want to write.

  3. Pick the storage you want to write it to (SD card, hard drive, SSD, etc.)

  4. Click "NEXT", confirm you wish to overwrite your storage and wait!

  The application also verifies that the operating system has been written
  correctly after writing has finished. With certain operating system images,
  the imager also supports customizing the first boot configuration (you will
  be prompted for more information after selecting "NEXT" in this case).
compression: lzo
grade: stable
confinement: strict
platforms:
  amd64: null
  arm64: null
  armhf: null
  # This isn't going to work until the gnome content snap supports it
  #riscv64: {}
  # Can't build ppc64el anymore as gnome content snap stopped supporting it
  # in Core 24
  #ppc64el: {}
  # Can't build s390x as upstream is little-endian specific
  #s390x: {}
package-repositories:
  - type: apt
    series: questing
    pocket: release
    url: http://archive.ubuntu.com/ubuntu/dists/questing/
    key-id: F6ECB3762474EDA9D21B7022871920D1991BC93C
    priority: always
apps:
  rpi-imager:
    command: usr/local/bin/rpi-imager
    command-chain:
      - bin/desktop-launch
    desktop: usr/local/share/applications/com.raspberrypi.rpi-imager.desktop
    environment:
      DISABLE_WAYLAND: 1
      # From https://github.com/ubuntu/snapcraft-desktop-helpers/pull/227#issuecomment-2694314156.
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy
    extensions: [gnome]
    plugs:
      - x11
      - opengl
      - network
      - desktop
      - desktop-legacy
      - home
      - removable-media  # required to re-write first-boot configuration
      - mount-observe    # required to report mounts on target media
      - network-manager  # required to grab image
      - network-control
      - cifs-mount
      - udisks2          # required for writing to sd card
      - hardware-observe # required to find card with lsblk
      - wayland          # required for theming on wayland
      - gsettings        # required for theming on wayland

# From https://github.com/ubuntu/snapcraft-desktop-helpers/pull/227#issuecomment-2694314156
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy

parts:
  desktop-qt6:
    source: snap/local/snapcraft-desktop-helpers
    source-type: local
    source-subdir: qt
    plugin: make
    make-parameters:
      - FLAVOR=qt6
    build-packages:
      - build-essential
      - qt6-base-dev
      - dpkg-dev
    stage-packages:
      - dmz-cursor-theme
      - light-themes
      - adwaita-icon-theme
      - gnome-themes-extra
      - shared-mime-info
      - libqt6gui6t64
      - libgtk2.0-0t64
      - libgdk-pixbuf2.0-0
      - libqt6svg6 # for loading icon themes which are svg
      - locales-all
      - xdg-user-dirs
      - fcitx-frontend-qt6
  imagewriter:
    plugin: cmake
    cmake-parameters:
      - -DENABLE_CHECK_VERSION=OFF
      - -DQt6_ROOT=
    source: https://github.com/raspberrypi/rpi-imager.git
    source-subdir: src
    source-type: git
    override-pull: |
      mv /root/project/rpi-imager/* "$CRAFT_PART_SRC"
      # Strip out the embedded source
      if [ -d "$CRAFT_PART_SRC"/embedded ]; then
        rm -fr "$CRAFT_PART_SRC"/embedded
      fi
      # Patch the required Qt version
      # patch -p1 < "$CRAFT_PROJECT_DIR"/qt-6.4.patch
      # Point the icon to the right place
      sed -i -e \
        's|^Icon=rpi-imager|Icon=/usr/local/share/icons/hicolor/128x128/apps/rpi-imager.png|' \
        "$CRAFT_PART_SRC"/debian/com.raspberrypi.rpi-imager.desktop
      curl -O https://launchpad.net/ubuntu/+archive/primary/+files/libicu78_78.2-1ubuntu1_amd64.deb
      # curl -O https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu78_78.1-1ubuntu1_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/libqt6core6t64_6.9.2+dfsg-3ubuntu2_amd64.deb
      # curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/qt6-base-private-dev_6.9.2+dfsg-3ubuntu2_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/qt6-qpa-plugins_6.9.2+dfsg-3ubuntu2_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/qmake6-bin_6.9.2+dfsg-3ubuntu2_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/qmake6_6.9.2+dfsg-3ubuntu2_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/libqt6dbus6_6.9.2+dfsg-3ubuntu2_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/qt6-base-dev-tools_6.9.2+dfsg-3ubuntu2_amd64.deb
      curl -O https://archive.ubuntu.com/ubuntu/pool/universe/q/qt6-base/qt6-base-dev_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg -i libicu78_78.2-1ubuntu1_amd64.deb
      dpkg -i libqt6core6t64_6.9.2+dfsg-3ubuntu2_amd64.deb
      # dpkg -i qt6-base-private-dev_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg -i qt6-qpa-plugins_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg -i qmake6-bin_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg -i qmake6_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg --auto-deconfigure -i libqt6dbus6_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg -i qt6-base-dev-tools_6.9.2+dfsg-3ubuntu2_amd64.deb
      dpkg -i qt6-base-dev_6.9.2+dfsg-3ubuntu2_amd64.deb
    stage-packages:
      - util-linux
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-window
      - qml6-module-qtqml-workerscript
      - dosfstools
      - fdisk
      - libqt6widgets6t64
    build-packages:
      - cmake
      - pkg-config
      - devscripts
      - libgnutls28-dev
      - libdrm-dev
      - qt6-base-dev
      - qt6-base-dev-tools
      - qt6-declarative-dev
      - qt6-tools-dev-tools
      - qt6-tools-dev
      - libqt6svg6-dev
