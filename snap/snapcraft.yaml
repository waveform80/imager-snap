name: rpi-imager
title: Raspberry Pi Imager
version: "2.0.12"
base: core24
summary: Raspberry Pi Imager
website:
  - https://www.raspberrypi.com/software/
source-code:
  - https://github.com/raspberrypi/rpi-imager
issues:
  - https://github.com/waveform80/imager-snap/issues
contact:
  - dave.jones@canonical.com
icon: images/rpi-imager.png
license: Apache-2.0
description: |
  Raspberry Pi Imager is an easy to use application for installing Raspberry Pi
  OS, or other operating systems, to an SD card ready to use with your
  Raspberry Pi.

  Usage is as simple as:

  1. Pick the Raspberry Pi board you want to use.

  2. Pick the operating system you want to write.

  3. Pick the storage you want to write it to (SD card, hard drive, SSD, etc.)

  4. Click "NEXT", confirm you wish to overwrite your storage and wait!

  The application also verifies that the operating system has been written
  correctly after writing has finished. With certain operating system images,
  the imager also supports customizing the first boot configuration (you will
  be prompted for more information after selecting "NEXT" in this case).
compression: lzo
grade: stable
confinement: strict
platforms:
  amd64: null
  arm64: null
  armhf: null
  # This isn't going to work until the gnome content snap supports it
  #riscv64: {}
  # Can't build ppc64el anymore as gnome content snap stopped supporting it
  # in Core 24
  #ppc64el: {}
  # Can't build s390x as upstream is little-endian specific
  #s390x: {}

apps:
  rpi-imager:
    command: usr/bin/rpi-imager
    command-chain:
      - snap/command-chain/qt-launch
    desktop: usr/share/applications/com.raspberrypi.rpi-imager.desktop
    environment:
      DISABLE_WAYLAND: 1
    extensions: [gnome]
    plugs:
      - x11
      - opengl
      - network
      - desktop
      - desktop-legacy
      - home
      - removable-media  # required to re-write first-boot configuration
      - mount-observe    # required to report mounts on target media
      - network-manager  # required to grab image
      - network-control
      - cifs-mount
      - udisks2          # required for writing to sd card
      - hardware-observe # required to find card with lsblk
      - wayland          # required for theming on wayland
      - gsettings        # required for theming on wayland
      - block-devices    # required to find card with lsblk

parts:
  qt:
    plugin: nil
    source: https://github.com/raspberrypi/rpi-imager.git
    source-type: git
    source-tag: v2.0.12
    build-packages:
      - build-essential
      - perl
      - python3
      - git
      - patch
      - cmake
      - ninja-build
      - pkg-config
      - wget
      - curl
      - ca-certificates
      - xz-utils
      # Qt6 build deps
      - bison
      - flex
      - gperf
      - libx11-dev
      - libx11-xcb-dev
      - libxext-dev
      - libxfixes-dev
      - libxi-dev
      - libxrender-dev
      - libxcomposite-dev
      - libxcursor-dev
      - libxdamage-dev
      - libxrandr-dev
      - libxtst-dev
      - libxcb1-dev
      - libxcb-cursor-dev
      - libxcb-glx0-dev
      - libxcb-icccm4-dev
      - libxcb-image0-dev
      - libxcb-keysyms1-dev
      - libxcb-randr0-dev
      - libxcb-render-util0-dev
      - libxcb-shape0-dev
      - libxcb-shm0-dev
      - libxcb-sync-dev
      - libxcb-util-dev
      - libxcb-xfixes0-dev
      - libxcb-xinerama0-dev
      - libxcb-xkb-dev
      - libinput-dev
      - libxkbcommon-dev
      - libxkbcommon-x11-dev
      - libfontconfig1-dev
      - libfreetype-dev
      - libdrm-dev
      - libegl1-mesa-dev
      - libgbm-dev
      - libgles2-mesa-dev
      - libvulkan-dev
      - libjpeg-dev
      - libpng-dev
      - zlib1g-dev
      - libasound2-dev
      - libpulse-dev
      - libnss3-dev
      - libssl-dev
      - libdbus-1-dev
      - libglib2.0-dev
      - libsqlite3-dev
      - libdouble-conversion-dev
      - libpcre2-dev
      - libatk1.0-dev
      - libatk-bridge2.0-dev
      - libcups2-dev
      - libassimp-dev
      # Wayland deps
      - libwayland-dev
      - wayland-protocols
      - libxkbcommon-dev
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0
      - libwayland-client0
      - libwayland-bin
    stage-packages:
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-xinerama0
      - libxkbcommon-x11-0
      - libdouble-conversion3
      - libpcre2-16-0
    override-pull: |
      craftctl default
      patch --batch --forward --fuzz=0 -d "$CRAFT_PART_SRC" -p1 \
        < "$CRAFT_PROJECT_DIR/no-arch-suffix.patch"
    override-build: |
      "$CRAFT_PART_SRC/qt/build-qt.sh" \
        --unprivileged \
        --version=6.11.1 \
        --cores="$CRAFT_PARALLEL_BUILD_COUNT" \
        --prefix="$CRAFT_PART_INSTALL/usr"
    prime:
      # Keep development files in stage for imagewriter, but out of the snap.
      - -usr/bin
      - -usr/include
      - -usr/lib/cmake
      - -usr/lib/pkgconfig
      - -usr/lib/*.a
      - -usr/mkspecs
      - -usr/metatypes
      - -usr/modules
      - -usr/qt6-toolchain.cmake

  imagewriter:
    after: [qt]
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DENABLE_CHECK_VERSION=OFF
      - -DQt6_ROOT="$CRAFT_STAGE"/usr
    source: https://github.com/raspberrypi/rpi-imager.git
    source-type: git
    source-tag: v2.0.12
    source-subdir: src
    build-packages:
      - g++
      - git
      - patch
      - pkg-config
      - libgnutls28-dev
      - libudev-dev
    stage-packages:
      - ca-certificates
      - util-linux
      - libgnutls30t64
      - libidn2-0
      - libnettle8t64
      - libudev1
    override-pull: |
      craftctl default
      patch --batch --forward --fuzz=0 -d "$CRAFT_PART_SRC" -p1 \
        < "$CRAFT_PROJECT_DIR/fix-package-version.patch"
      patch --batch --forward --fuzz=0 -d "$CRAFT_PART_SRC" -p1 \
        < "$CRAFT_PROJECT_DIR/fix-udisks2-authorization.patch"
    override-build: |
      craftctl default
      # Check the version actually compiled into Imager, not just snap metadata.
      grep -Fx '#define IMAGER_VERSION_STR "v2.0.12"' \
        "$CRAFT_PART_BUILD/imager_version.h"
      test -x "$CRAFT_PART_INSTALL/usr/bin/rpi-imager"
      test -f "$CRAFT_PART_INSTALL/usr/share/applications/com.raspberrypi.rpi-imager.desktop"
    prime:
      # Host udev rules are managed by snapd interfaces, not files in the snap.
      - -usr/lib/udev/rules.d

  launcher:
    plugin: dump
    source: snap/local
    organize:
      qt-launch: snap/command-chain/qt-launch
      qt.conf: usr/bin/qt.conf
